name: verify
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.3.6-management
        env:
          RABBITMQ_DEFAULT_USER: manabinder
          RABBITMQ_DEFAULT_PASS: ci-only
        ports: ["5672:5672"]
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-retries 15
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: manabinder_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only@127.0.0.1:5432/manabinder_test
      TEST_RABBITMQ_URL: amqp://manabinder:ci-only@127.0.0.1:5672
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker build -t manabinder:ci .
      - run: docker build -f deploy/Dockerfile.edge -t manabinder-edge:ci .
      - run: node scripts/container-smoke.mjs
