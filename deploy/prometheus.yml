global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9091
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9091
  - job_name: relay
    dns_sd_configs:
      - names: [relay]
        type: A
        port: 9091
  - job_name: scheduler
    static_configs:
      - targets: [scheduler:9091]
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
