resolver 127.0.0.11 valid=5s ipv6=off;
upstream manabinder_api {
    zone api 64k;
    server api:4174 resolve;
    keepalive 32;
}
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 32k;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://cards.scryfall.io; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://manabinder_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503;
        # Nginx does not replay non-idempotent methods once sent to upstream.
    }
    location = /readyz { proxy_pass http://manabinder_api; }
    location = /healthz { return 200 'ok'; }
    location = /metrics { return 404; }
    location / { try_files $uri $uri/ =404; }
}
